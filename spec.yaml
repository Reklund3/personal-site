name: site
region: sfo
services:
  - name: site
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: Reklund3/personal-site
    health_check:
      http_path: /health_check
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: APP_APPLICATION__BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${personal_site.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${personal_site.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${personal_site.HOSTNAME}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${personal_site.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${personal_site.DATABASE}
databases:
  - engine: PG
    name: personal_site
    num_nodes: 1
    size: db-s-dev-database
    # Observed on the running component ("starting PostgreSQL 16.14"), not a
    # requested upgrade. This field is an instruction, not a description: it had
    # read "12" since the spec was written, which is now stale — PostgreSQL 12
    # hit EOL in November 2024 and DigitalOcean force-upgrades EOL managed
    # databases. Applying the spec while it still said 12 would have asked for a
    # downgrade of a component already on 16.
    version: "16"