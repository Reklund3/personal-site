name: UI Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ui-test:
    name: UI Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ui

      - name: Run lint
        run: npm run lint
        working-directory: ui

      - name: Run tests
        run: npm test
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
